name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            # Cheap and high-signal, so they run before the slow gates.
            - name: Suppression guard
              run: pnpm check:suppressions

            - name: Typecheck
              run: pnpm typecheck

            # A green typecheck only counts if it saw every file.
            - name: Program-membership guard
              run: pnpm check:program

            - name: Lint
              run: pnpm lint

            # A clean lint means nothing if the layering rules stopped reporting.
            - name: Boundary self-check
              run: pnpm check:boundaries

            # A provider's id union ends in `| (string & {})`, so a retired id only fails at the API.
            - name: Model-id guard
              run: pnpm check:models

            - name: Format check
              run: pnpm format:check

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

    integration:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: galleo
                    POSTGRES_PASSWORD: galleo
                    POSTGRES_DB: galleo
                # 8602 matches docker-compose.yml and vitest.integration.config.ts
                ports:
                    - 8602:5432
                options: >-
                    --health-cmd "pg_isready -U galleo -d galleo"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Integration tests
              run: pnpm test:int
