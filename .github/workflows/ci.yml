name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            # Cheap and high-signal, so they run before the slow gates.
            - name: Suppression guard
              run: pnpm check:suppressions

            - name: Typecheck
              run: pnpm typecheck

            # A green typecheck only counts if it saw every file.
            - name: Program-membership guard
              run: pnpm check:program

            - name: Lint
              run: pnpm lint

            # A clean lint means nothing if the layering rules stopped reporting.
            - name: Boundary self-check
              run: pnpm check:boundaries

            # A provider's id union ends in `| (string & {})`, so a retired id only fails at the API.
            - name: Model-id guard
              run: pnpm check:models

            # An em-dash in user-facing copy is the tell that a string was machine-written.
            - name: Copy guard
              run: pnpm check:copy

            # The map is where a contributor decides which file a change belongs in.
            - name: Module-map guard
              run: pnpm check:modules

            # A request body is untrusted input, so a route must state the shape it accepts.
            - name: Body-validation guard
              run: pnpm check:validation

            - name: Format check
              run: pnpm format:check

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

    # The layout engine's only automated guard. Real Chromium because ~70 webfonts drive
    # measureText, measureText drives the solver, and the solver decides every box: measure with a
    # fallback face and you are checking a layout nobody sees. Free, ~10s, and deterministic, so
    # unlike the LLM judges it can gate every push.
    visual:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            # ~150MB; without this it downloads on every run
            - name: Cache Chromium
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            # excluded from `pnpm test` because a real browser per worker contends and flakes
            - name: Capture tests
              run: pnpm test:browser

            # fails loudly if the font CDN is unreachable rather than measuring Times
            - name: Visual checks over the corpus
              run: pnpm eval:shots

            - name: Upload the failing renders
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-failures
                  path: shots/
                  if-no-files-found: ignore

    integration:
        runs-on: ubuntu-latest
        services:
            postgres:
                # pgvector, not plain postgres: chunks.embedding needs the vector type
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: galleo
                    POSTGRES_PASSWORD: galleo
                    POSTGRES_DB: galleo
                # 8602 matches docker-compose.yml and vitest.integration.config.ts
                ports:
                    - 8602:5432
                options: >-
                    --health-cmd "pg_isready -U galleo -d galleo"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Integration tests
              run: pnpm test:int
