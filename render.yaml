# Render Blueprint — Galleo. One web service (Node) runs Hono, which serves the built SPA AND /api on one
# origin (see .docs/hosting.md). Postgres is Neon (external); set DATABASE_URL in the dashboard.
services:
    - type: web
      name: galleo
      runtime: node
      region: oregon # co-locate with the Neon project region
      plan: free # upgrade to `starter`+ for always-on and pre-deploy support; `standard` (2 GB) if AI/export OOMs
      branch: main
      autoDeploy: true
      # Migrations run at the END of the build (&&: a failed build never reaches them; a failed
      # migration fails the build, so the old deploy stays live). The free instance type silently
      # drops preDeployCommand — on a paid plan, move the db step to preDeployCommand instead.
      # No data backfill step: digest + search_text are derived at write time (services/core/derived.ts),
      # enforced by lint, so no row can fall out of sync and there is nothing for a sweep to repair.
      buildCommand: pnpm install --frozen-lockfile && pnpm build && pnpm db:migrate
      startCommand: pnpm start # NODE_ENV=production tsx services/server.ts
      healthCheckPath: /health
      envVars:
          - key: NODE_ENV
            value: production
          - key: SESSION_SECRET
            generateValue: true # Render mints a strong secret once
          # --- secrets: set in the Render dashboard (never committed) ---
          - key: DATABASE_URL # Neon direct connection string
            sync: false
          - key: APP_URL # the public origin, e.g. https://galleo.onrender.com
            sync: false
          - key: ANTHROPIC_API_KEY
            sync: false
          # --- optional; omit until the feature is turned on ---
          - key: GOOGLE_API_KEY # Gemini text + AI image generation
            sync: false
          - key: UNSPLASH_ACCESS_KEY
            sync: false
          - key: PEXELS_API_KEY
            sync: false
          - key: PIXABAY_API_KEY
            sync: false
          - key: RESEND_API_KEY # share-invite email
            sync: false
          - key: MAIL_FROM
            sync: false
          - key: STRIPE_SECRET_KEY # billing; leave unset to keep everyone on Free
            sync: false
          - key: STRIPE_WEBHOOK_SECRET
            sync: false
          - key: STRIPE_PRICE_PRO_MONTH
            sync: false
          - key: STRIPE_PRICE_PRO_YEAR
            sync: false
          - key: STRIPE_PRICE_PREMIUM_MONTH
            sync: false
          - key: STRIPE_PRICE_PREMIUM_YEAR
            sync: false
          - key: STRIPE_PORTAL_CONFIG
            sync: false
          # --- product analytics (PostHog) ---
          # Both keys are the same public `phc_` project key: it is write-only and ships in the
          # browser bundle by design. Unset = disabled, silently, with no network calls.
          #
          # VITE_POSTHOG_KEY is read at BUILD time, not at run time: Vite inlines
          # `import.meta.env.VITE_*` as a literal, so the key has to exist before `pnpm build` runs
          # in buildCommand above. Setting it only in the runtime environment ships a bundle with
          # analytics compiled out, no events, and nothing in the logs saying why.
          - key: POSTHOG_KEY
            sync: false
          - key: VITE_POSTHOG_KEY
            sync: false
          # Optional. Defaults: https://us.i.posthog.com for ingest, https://us.posthog.com for the
          # app links the proxy would otherwise hide. Set only to move region.
          - key: POSTHOG_HOST
            sync: false
          - key: VITE_POSTHOG_HOST
            sync: false
